<!DOCTYPE html>

<html class="dark" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Marmu - Orçamentos</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                            "on-tertiary-container": "#bbf7d0",
                            "inverse-surface": "#fafafa",
                            "error": "#ef4444",
                            "tertiary-container": "#065f46",
                            "surface-container-high": "#18181b",
                            "on-primary-fixed": "#2e1065",
                            "surface-container-highest": "#1e1e22",
                            "primary-fixed": "#ede9fe",
                            "secondary": "#71717a",
                            "outline": "#52525b",
                            "on-secondary-fixed": "#18181b",
                            "surface-tint": "#a78bfa",
                            "secondary-fixed": "#a1a1aa",
                            "on-tertiary": "#001a12",
                            "tertiary": "#34d399",
                            "surface-variant": "#18181b",
                            "error-container": "#3b1111",
                            "inverse-on-surface": "#09090b",
                            "primary": "#a78bfa",
                            "surface-container-lowest": "#09090b",
                            "on-error-container": "#fca5a5",
                            "on-background": "#fafafa",
                            "on-primary-fixed-variant": "#5b21b6",
                            "on-primary": "#0a0012",
                            "primary-container": "#7c3aed",
                            "outline-variant": "#27272a",
                            "inverse-primary": "#5b21b6",
                            "surface-container-low": "#0f0f12",
                            "surface-bright": "#18181b",
                            "on-tertiary-fixed-variant": "#047857",
                            "on-error": "#1a0000",
                            "on-surface-variant": "#a1a1aa",
                            "on-secondary": "#09090b",
                            "on-secondary-container": "#a1a1aa",
                            "tertiary-fixed-dim": "#6ee7b7",
                            "on-primary-container": "#ede9fe",
                            "primary-fixed-dim": "#c4b5fd",
                            "on-secondary-fixed-variant": "#3f3f46",
                            "background": "#09090b",
                            "surface": "#0c0c0f",
                            "secondary-fixed-dim": "#71717a",
                            "tertiary-fixed": "#bbf7d0",
                            "surface-container": "#121215",
                            "on-tertiary-fixed": "#003318",
                            "surface-dim": "#0c0c0f",
                            "secondary-container": "#27272a",
                            "on-surface": "#fafafa"
                    },
                    "borderRadius": {
                            "DEFAULT": "0.25rem",
                            "lg": "0.5rem",
                            "xl": "0.75rem",
                            "full": "9999px",
                            "2xl": "1rem",
                            "3xl": "1.5rem"
                    },
                    "spacing": {},
                    "fontFamily": {
                            "headline": ["Geist", "sans-serif"],
                            "display": ["Geist", "sans-serif"],
                            "body": ["Geist", "sans-serif"],
                            "label": ["Geist", "sans-serif"]
                    },
                    "fontSize": {}
                },
            },
        }
    </script>
<style>
        body { font-family: 'Geist', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Custom Scrollbar for dark theme */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #09090b; 
        }
        ::-webkit-scrollbar-thumb {
            background: #27272a; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #52525b; 
        }

        /* Input autofill fix for dark mode */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px #121215 inset !important;
            -webkit-text-fill-color: #fafafa !important;
            transition: background-color 5000s ease-in-out 0s;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex antialiased">
<!-- OVERLAY & MODAL (Simulating focused task, hiding navigation shell) -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 overflow-y-auto">
<!-- Modal Container -->
<div class="bg-surface-container-low w-full max-w-xl rounded-3xl border border-outline-variant shadow-2xl relative my-auto animate-[fadeIn_0.2s_ease-out]">
<!-- Close Button -->
<button aria-label="Close modal" class="absolute top-6 right-6 p-2 rounded-full bg-surface-container-high text-on-surface-variant hover:text-on-surface hover:bg-surface-container-highest transition-colors" type="button">
<span class="material-symbols-outlined">close</span>
</button>
<!-- Modal Header -->
<div class="px-8 pt-8 pb-6 border-b border-outline-variant/50">
<h2 class="text-2xl font-headline font-bold text-on-surface tracking-tight mb-2">Dados do Cliente</h2>
<p class="text-sm font-body text-secondary">Preencha as informações para gerar o orçamento unificado.</p>
</div>
<!-- Modal Body -->
<div class="p-8 space-y-8">
<!-- Client Info Section -->
<div class="space-y-5">
<!-- Full Name -->
<div>
<label class="block text-xs font-label font-bold text-secondary tracking-widest uppercase mb-2" for="nome">Nome Completo</label>
<input class="w-full bg-surface-container text-on-surface border border-outline-variant rounded-xl px-4 py-3.5 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-surface-variant font-medium" id="nome" type="text" value="Carlos"/>
</div>
<!-- Doc & Phone Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-5">
<div>
<label class="block text-xs font-label font-bold text-secondary tracking-widest uppercase mb-2" for="documento">CPF / CNPJ</label>
<input class="w-full bg-surface-container text-on-surface border border-outline-variant rounded-xl px-4 py-3.5 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-surface-variant font-medium" id="documento" placeholder="000.000.000-00" type="text"/>
</div>
<div>
<label class="block text-xs font-label font-bold text-secondary tracking-widest uppercase mb-2" for="celular">Celular</label>
<input class="w-full bg-surface-container text-on-surface border border-outline-variant rounded-xl px-4 py-3.5 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-surface-variant font-medium" id="celular" placeholder="(00) 00000-0000" type="tel"/>
</div>
</div>
<!-- Address -->
<div>
<label class="block text-xs font-label font-bold text-secondary tracking-widest uppercase mb-2" for="endereco">Endereço de Entrega</label>
<input class="w-full bg-surface-container text-on-surface border border-outline-variant rounded-xl px-4 py-3.5 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-surface-variant font-medium" id="endereco" placeholder="Rua, Número, Bairro, Cidade" type="text"/>
</div>
</div>
<!-- Payment Methods Section -->
<div>
<label class="block text-xs font-label font-bold text-secondary tracking-widest uppercase mb-4">Formas de Pagamento Aceitas</label>
<div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
<!-- Option 1: Selected -->
<label class="relative flex items-center justify-center p-3.5 rounded-xl border-2 border-primary bg-primary-container/10 cursor-pointer transition-all hover:bg-primary-container/20 group">
<input checked="" class="sr-only peer" name="pagamento" type="checkbox" value="dinheiro_pix"/>
<div class="flex items-center gap-2 text-primary font-medium text-sm">
<span class="material-symbols-outlined text-[20px]">payments</span>
                                Dinheiro/Pix
                            </div>
</label>
<!-- Option 2: Selected -->
<label class="relative flex items-center justify-center p-3.5 rounded-xl border-2 border-primary bg-primary-container/10 cursor-pointer transition-all hover:bg-primary-container/20 group">
<input checked="" class="sr-only peer" name="pagamento" type="checkbox" value="credito"/>
<div class="flex items-center gap-2 text-primary font-medium text-sm">
<span class="material-symbols-outlined text-[20px]">credit_card</span>
                                Crédito
                            </div>
</label>
<!-- Option 3: Unselected -->
<label class="relative flex items-center justify-center p-3.5 rounded-xl border-2 border-outline-variant bg-surface-container cursor-pointer transition-all hover:border-outline hover:bg-surface-container-high group">
<input class="sr-only peer" name="pagamento" type="checkbox" value="debito"/>
<div class="flex items-center gap-2 text-secondary group-hover:text-on-surface transition-colors font-medium text-sm">
<span class="material-symbols-outlined text-[20px]">credit_card</span>
                                Débito
                            </div>
</label>
<!-- Option 4: Unselected -->
<label class="relative flex items-center justify-center p-3.5 rounded-xl border-2 border-outline-variant bg-surface-container cursor-pointer transition-all hover:border-outline hover:bg-surface-container-high group">
<input class="sr-only peer" name="pagamento" type="checkbox" value="boleto"/>
<div class="flex items-center gap-2 text-secondary group-hover:text-on-surface transition-colors font-medium text-sm">
<span class="material-symbols-outlined text-[20px]">description</span>
                                Boleto
                            </div>
</label>
</div>
</div>
<!-- Delivery & Additional Options Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-8">
<!-- Delivery Time -->
<div>
<label class="block text-xs font-label font-bold text-secondary tracking-widest uppercase mb-3" for="prazo">Prazo de Entrega (Dias)</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-secondary text-[20px]">schedule</span>
</div>
<input class="w-full bg-surface-container text-on-surface border border-outline-variant rounded-xl pl-12 pr-4 py-3.5 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all font-bold text-lg" id="prazo" type="number" value="15"/>
</div>
</div>
<!-- Additional Options -->
<div>
<label class="block text-xs font-label font-bold text-secondary tracking-widest uppercase mb-3">Opções Adicionais</label>
<div class="space-y-3">
<!-- Discount Option (Active state style) -->
<div class="flex items-center justify-between p-3 rounded-xl border border-tertiary/30 bg-tertiary-container/10">
<div>
<span class="block text-[10px] font-bold text-tertiary tracking-wider uppercase mb-0.5">Desconto P/ Vista</span>
<div class="flex items-baseline gap-1 text-on-surface">
<span class="font-bold text-lg">10</span>
<span class="text-sm font-medium text-secondary">%</span>
</div>
</div>
<div class="w-6 h-6 rounded-full bg-tertiary flex items-center justify-center shadow-[0_0_10px_rgba(52,211,153,0.3)]">
<span class="material-symbols-outlined text-on-tertiary text-[14px] font-bold">check</span>
</div>
</div>
<!-- Installment Option (Active state style) -->
<div class="flex items-center justify-between p-3 rounded-xl border border-primary/30 bg-primary-container/10">
<div>
<span class="block text-[10px] font-bold text-primary tracking-wider uppercase mb-0.5">Parcelamento S/ Juros</span>
<div class="flex items-baseline gap-1 text-on-surface">
<span class="text-xs font-medium text-secondary mr-1">Até</span>
<span class="font-bold text-lg">12</span>
<span class="text-sm font-medium text-secondary">x</span>
</div>
</div>
<div class="w-6 h-6 rounded-full bg-primary flex items-center justify-center shadow-[0_0_10px_rgba(167,139,250,0.3)]">
<span class="material-symbols-outlined text-on-primary text-[14px] font-bold">check</span>
</div>
</div>
</div>
</div>
</div>
</div>
<!-- Modal Footer -->
<div class="px-8 pb-8 pt-4">
<button class="w-full flex items-center justify-center gap-2 bg-primary hover:bg-primary-fixed hover:scale-[1.02] active:scale-[0.98] text-on-primary font-bold py-4 px-6 rounded-xl transition-all duration-200 shadow-[0_0_20px_rgba(167,139,250,0.2)]" type="button">
<span class="material-symbols-outlined">receipt_long</span>
<span class="tracking-wide">GERAR ORÇAMENTO FINAL</span>
</button>
</div>
</div>
</div>
<!-- Hidden Main Content Area (To provide context that we are in an app, but it's obscured by modal) -->
<div class="flex w-full h-full opacity-20 pointer-events-none filter blur-sm">
<!-- Render SideNavBar structure just for visual context in background -->
<aside class="fixed left-0 top-0 h-screen flex flex-col py-6 bg-background dark:bg-background text-primary dark:text-primary font-body text-label-sm tracking-tight text-xl font-headline font-black text-on-background dark:text-on-background tracking-tighter docked left-0 h-full w-64 border-r border-outline-variant flat no shadows border-r border-outline-variant z-10">
<div class="px-6 mb-8">
<h1 class="text-xl font-headline font-black text-on-background tracking-tighter">Marmu</h1>
<p class="text-xs text-secondary mt-1 font-body">Management System</p>
</div>
<div class="px-4 mb-6">
<button class="w-full bg-primary text-on-primary font-medium py-2.5 px-4 rounded-lg flex items-center justify-center gap-2 hover:bg-primary-fixed transition-colors">
<span class="material-symbols-outlined text-sm">add</span>
                    Novo Projeto
                </button>
</div>
<nav class="flex-1 space-y-1">
<a class="flex items-center gap-3 text-secondary hover:text-on-surface px-4 py-3 mx-2 transition-colors rounded-lg" href="#">
<span class="material-symbols-outlined">bolt</span>
                    Acesso Rápido
                </a>
<a class="flex items-center gap-3 bg-surface-container-highest text-primary font-bold rounded-lg px-4 py-3 mx-2" href="#">
<span class="material-symbols-outlined">description</span>
                    Orçamentos
                </a>
</nav>
</aside>
</div>
</body></html>
