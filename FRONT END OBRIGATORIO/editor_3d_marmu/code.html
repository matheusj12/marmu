<!DOCTYPE html>

<html class="dark" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Editor 3D - Marmu</title>
<!-- Google Fonts: Geist & Material Symbols -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-tertiary-container": "#bbf7d0",

                        "error": "#ef4444",
                        "tertiary-container": "#065f46",
                        "surface-container-high": "#18181b",
                        "on-primary-fixed": "#2e1065",
                        "surface-container-highest": "#1e1e22",
                        "primary-fixed": "#ede9fe",
                        "secondary": "#71717a",
                        "outline": "#52525b",
                        "on-secondary-fixed": "#18181b",
                        "surface-tint": "#a78bfa",
                        "secondary-fixed": "#a1a1aa",
                        "on-tertiary": "#001a12",
                        "tertiary": "#34d399",
                        "surface-variant": "#18181b",
                        "error-container": "#3b1111",
                        "inverse-on-surface": "#09090b",
                        "primary": "#a78bfa",
                        "surface-container-lowest": "#09090b",
                        "on-error-container": "#fca5a5",
                        "on-background": "#fafafa",
                        "on-primary-fixed-variant": "#5b21b6",
                        "on-primary": "#0a0012",
                        "primary-container": "#7c3aed",
                        "outline-variant": "#27272a",
                        "inverse-primary": "#5b21b6",
                        "surface-container-low": "#0f0f12",
                        "surface-bright": "#18181b",
                        "on-tertiary-fixed-variant": "#047857",
                        "on-error": "#1a0000",
                        "on-surface-variant": "#a1a1aa",
                        "on-secondary": "#09090b",
                        "on-secondary-container": "#a1a1aa",
                        "tertiary-fixed-dim": "#6ee7b7",
                        "on-primary-container": "#ede9fe",
                        "primary-fixed-dim": "#c4b5fd",
                        "on-secondary-fixed-variant": "#3f3f46",
                        "background": "#09090b",
                        "surface": "#0c0c0f",
                        "secondary-fixed-dim": "#71717a",
                        "tertiary-fixed": "#bbf7d0",
                        "surface-container": "#121215",
                        "on-tertiary-fixed": "#003318",
                        "surface-dim": "#0c0c0f",
                        "secondary-container": "#27272a",
                        "on-surface": "#fafafa"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"

                    fontFamily: {
                        "headline": ["Geist"],
                        "display": ["Geist"],
                        "body": ["Geist"],
                        "label": ["Geist"]

            }

<style>
        /* 3D Grid floor effect */
        .grid-floor {
            position: absolute;
            bottom: -50%;
            left: -50%;
            width: 200%;
            height: 150%;
            background-image: 
                linear-gradient(to right, rgba(39, 39, 42, 0.5) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(39, 39, 42, 0.5) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: perspective(800px) rotateX(75deg);
            transform-origin: top;
            pointer-events: none;
            z-index: 0;
            mask-image: linear-gradient(to bottom, transparent 10%, black 60%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 10%, black 60%);
        }
        
        /* Utility for Material Icons Fill */
        .icon-fill-1 { font-variation-settings: 'FILL' 1; }
    </style>
</head>
<body class="bg-background text-on-background font-body h-screen w-screen overflow-hidden flex flex-col selection:bg-primary/30">
<!-- TopAppBar -->
<header class="h-14 bg-surface-container-lowest border-b border-outline-variant flex items-center justify-between px-4 z-20 shrink-0 ml-16">
<!-- Left: Tool Config -->
<div class="flex items-center gap-4">
<div class="bg-surface-container border border-outline-variant rounded-md flex items-center px-3 py-1.5 h-9">
<div class="flex flex-col justify-center mr-3">
<span class="text-[9px] font-bold tracking-wider text-secondary uppercase leading-none mb-0.5">Posicionamento</span>
<span class="text-[10px] text-on-surface-variant uppercase leading-none">Altura (Z) / Lateral (X)</span>
</div>
<div class="flex items-center gap-2">
<div class="flex items-center gap-1">
<span class="text-xs text-secondary font-medium">Z</span>
<input class="w-12 h-6 bg-surface-container-highest border-none text-on-surface text-xs text-center rounded focus:ring-1 focus:ring-primary rounded-sm p-0" type="text" value="90"/>
</div>
<div class="flex items-center gap-1">
<span class="text-xs text-secondary font-medium">X</span>
<input class="w-12 h-6 bg-surface-container-highest border-none text-on-surface text-xs text-center rounded focus:ring-1 focus:ring-primary rounded-sm p-0" type="text" value="0"/>
</div>
<span class="text-[10px] text-primary font-bold ml-1">CM</span>
</div>
</div>
<!-- Navigation Links from JSON -->
<nav class="hidden md:flex items-center gap-4 ml-6 h-full">
<a class="text-primary border-b-2 border-primary h-full flex items-center px-2 text-sm font-medium transition-all duration-200" href="#">Visualização</a>
<a class="text-secondary hover:text-on-surface-variant hover:bg-surface-container-highest rounded-md px-3 py-1 text-sm font-medium transition-all duration-200" href="#">Coordenadas</a>
<a class="text-secondary hover:text-on-surface-variant hover:bg-surface-container-highest rounded-md px-3 py-1 text-sm font-medium transition-all duration-200" href="#">Dimensões</a>
</nav>
</div>
<!-- Right: Actions -->
<div class="flex items-center gap-2">
<button class="w-8 h-8 flex items-center justify-center rounded text-secondary hover:text-on-surface hover:bg-surface-container-high transition-colors" title="Desfazer">
<span class="material-symbols-outlined text-lg">undo</span>
</button>
<button class="w-8 h-8 flex items-center justify-center rounded text-secondary hover:text-on-surface hover:bg-surface-container-high transition-colors" title="Refazer">
<span class="material-symbols-outlined text-lg">redo</span>
</button>
<div class="w-px h-4 bg-outline-variant mx-1"></div>
<button class="w-8 h-8 flex items-center justify-center rounded text-secondary hover:text-on-surface hover:bg-surface-container-high transition-colors" title="Configurações">
<span class="material-symbols-outlined text-lg">settings</span>
</button>
<button class="ml-2 bg-primary hover:bg-primary-container text-on-primary font-medium text-sm px-4 py-1.5 rounded transition-colors shadow-[0_0_15px_rgba(167,139,250,0.1)]">
                Salvar Projeto
            </button>
</div>
</header>
<!-- Main Workspace Area -->
<div class="flex flex-1 relative overflow-hidden">
<!-- Technical Left Rail (Adapted SideNavBar) -->
<aside class="w-16 bg-surface-container-lowest border-r border-outline-variant flex flex-col items-center py-4 z-30 absolute left-0 top-0 h-full gap-3">
<!-- Primary Add Tool -->
<button class="w-10 h-10 rounded-xl bg-primary text-on-primary flex items-center justify-center shadow-[0_0_20px_rgba(167,139,250,0.2)] mb-2 hover:scale-105 transition-transform">
<span class="material-symbols-outlined icon-fill-1">add</span>
</button>
<!-- Tools Group -->
<div class="flex flex-col gap-2 w-full px-3 mt-2">
<button class="w-full aspect-square rounded-lg flex items-center justify-center text-secondary hover:bg-surface-container-high hover:text-on-surface transition-colors">
<span class="material-symbols-outlined text-[20px]">layers</span>
</button>
<button class="w-full aspect-square rounded-lg flex items-center justify-center bg-surface-container-high text-primary relative shadow-sm border border-outline-variant/50 transition-colors">
<div class="absolute left-0 top-1/4 bottom-1/4 w-0.5 bg-primary rounded-r-full"></div>
<span class="material-symbols-outlined text-[20px] icon-fill-1">grid_view</span>
</button>
<button class="w-full aspect-square rounded-lg flex items-center justify-center text-secondary hover:bg-surface-container-high hover:text-on-surface transition-colors">
<span class="material-symbols-outlined text-[20px]">build</span>
</button>
<button class="w-full aspect-square rounded-lg flex items-center justify-center text-secondary hover:bg-surface-container-high hover:text-on-surface transition-colors">
<span class="material-symbols-outlined text-[20px]">palette</span>
</button>
</div>
</aside>
<!-- 3D Canvas Area -->
<main class="flex-1 ml-16 relative bg-[#050508] overflow-hidden">
<!-- 3D Perspective Grid -->
<div class="grid-floor"></div>
<!-- Floating Components Menu -->
<div class="absolute top-6 left-6 w-52 bg-surface-container-lowest border border-outline-variant rounded-xl shadow-2xl z-20 flex flex-col overflow-hidden backdrop-blur-sm bg-opacity-95">
<div class="px-4 py-3 border-b border-outline-variant/50">
<h3 class="text-[10px] font-bold text-secondary uppercase tracking-widest">Tipo de Item</h3>
</div>
<div class="p-2 flex flex-col gap-1">
<button class="w-full text-left px-3 py-2 rounded-lg bg-primary/10 text-primary border border-primary/20 flex items-center gap-2 transition-colors">
<span class="text-xs font-semibold tracking-wide">CUBA SIMPLES</span>
<div class="ml-auto w-1.5 h-1.5 rounded-full bg-primary shadow-[0_0_5px_rgba(167,139,250,0.8)]"></div>
</button>
<button class="w-full text-left px-3 py-2 rounded-lg text-secondary hover:bg-surface-container hover:text-on-surface transition-colors">
<span class="text-xs font-medium tracking-wide">CUBA DUPLA</span>
</button>
<button class="w-full text-left px-3 py-2 rounded-lg text-secondary hover:bg-surface-container hover:text-on-surface transition-colors">
<span class="text-xs font-medium tracking-wide">CUBA OVAL</span>
</button>
<button class="w-full text-left px-3 py-2 rounded-lg text-secondary hover:bg-surface-container hover:text-on-surface transition-colors">
<span class="text-xs font-medium tracking-wide">CUBA DE SOBREPOR</span>
</button>
<button class="w-full text-left px-3 py-2 rounded-lg text-secondary hover:bg-surface-container hover:text-on-surface transition-colors">
<span class="text-xs font-medium tracking-wide">COOKTOP SB</span>
</button>
<button class="w-full text-left px-3 py-2 rounded-lg text-secondary hover:bg-surface-container hover:text-on-surface transition-colors">
<span class="text-xs font-medium tracking-wide">TORNEIRA BANCADA</span>
</button>
</div>
</div>
<!-- Viewport Label -->
<div class="absolute bottom-6 left-6 z-10">
<span class="px-2 py-1 bg-surface-container border border-outline-variant rounded text-[10px] font-bold text-on-surface tracking-widest uppercase shadow-md">Visualização 3D</span>
</div>
<!-- The 3D Object / Blueprint -->
<div class="absolute top-[40%] left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-10">
<!-- Main Rectangle Piece -->
<div class="w-[500px] h-[160px] relative">
<!-- Core Shape -->
<div class="absolute inset-0 border-[1.5px] border-[#3b82f6] bg-[#1e3a8a]/20 shadow-[inset_0_0_20px_rgba(59,130,246,0.1)]"></div>
<!-- Top Extension/Shadow (Simulating depth slightly) -->
<div class="absolute top-[-20px] left-[15px] right-[15px] h-[20px] border-t border-x border-[#3b82f6]/40 bg-[#1e3a8a]/10"></div>
<!-- Side Extensions -->
<div class="absolute top-[20px] bottom-[20px] left-[-20px] w-[20px] border-y border-l border-[#3b82f6]/40 bg-[#1e3a8a]/10"></div>
<div class="absolute top-[20px] bottom-[20px] right-[-20px] w-[20px] border-y border-r border-[#3b82f6]/40 bg-[#1e3a8a]/10"></div>
<!-- Dimension Labels & Lines -->
<!-- Top Dimension -->
<div class="absolute top-0 left-1/2 transform -translate-x-1/2 -translate-y-1/2 flex items-center justify-center z-20">
<div class="bg-inverse-surface text-inverse-on-surface text-[11px] font-bold px-3 py-0.5 rounded-full shadow-lg border border-outline/20">250.0</div>
</div>
<div class="absolute top-[-30px] left-1/2 transform -translate-x-1/2 text-[9px] text-[#3b82f6] font-medium tracking-wide">250.0 x 15.0 cm</div>
<!-- Bottom Dimension -->
<div class="absolute bottom-0 left-1/2 transform -translate-x-1/2 translate-y-1/2 flex items-center justify-center z-20">
<div class="bg-inverse-surface text-inverse-on-surface text-[11px] font-bold px-3 py-0.5 rounded-full shadow-lg border border-outline/20">250.0</div>
</div>
<div class="absolute bottom-[-25px] left-1/2 transform -translate-x-1/2 text-[9px] text-secondary font-medium tracking-wide">250.0 x 15.0 cm</div>
<!-- Left Dimension -->
<div class="absolute left-0 top-1/2 transform -translate-x-1/2 -translate-y-1/2 flex items-center justify-center z-20">
<div class="bg-inverse-surface text-inverse-on-surface text-[11px] font-bold px-2 py-2 rounded-full shadow-lg border border-outline/20 leading-none rotate-[-90deg]">60.0</div>
</div>
<div class="absolute left-[-45px] top-1/2 transform -translate-y-1/2 rotate-[-90deg] text-[9px] text-secondary font-medium tracking-wide w-24 text-center">60.0 x 15.0 cm</div>
<!-- Right Dimension -->
<div class="absolute right-0 top-1/2 transform translate-x-1/2 -translate-y-1/2 flex items-center justify-center z-20">
<div class="bg-inverse-surface text-inverse-on-surface text-[11px] font-bold px-2 py-2 rounded-full shadow-lg border border-outline/20 leading-none rotate-90">60.0</div>
</div>
<div class="absolute right-[-45px] top-1/2 transform -translate-y-1/2 rotate-90 text-[9px] text-secondary font-medium tracking-wide w-24 text-center">60.0 x 15.0 cm</div>
<!-- Center Label -->
<div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2">
<div class="bg-[#1e3a8a]/40 border border-[#3b82f6]/50 text-[#93c5fd] text-[9px] font-semibold px-2 py-1 rounded backdrop-blur-sm">250.0 x 60.0 cm</div>
</div>
<!-- Corner Nodes -->
<div class="absolute top-0 left-0 transform -translate-x-1/2 -translate-y-1/2 w-3.5 h-3.5 bg-[#3b82f6] rounded-full border-2 border-background shadow-md"></div>
<div class="absolute top-0 right-0 transform translate-x-1/2 -translate-y-1/2 w-3.5 h-3.5 bg-[#3b82f6] rounded-full border-2 border-background shadow-md"></div>
<div class="absolute bottom-0 left-0 transform -translate-x-1/2 translate-y-1/2 w-3.5 h-3.5 bg-[#3b82f6] rounded-full border-2 border-background shadow-md"></div>
<div class="absolute bottom-0 right-0 transform translate-x-1/2 translate-y-1/2 w-3.5 h-3.5 bg-[#3b82f6] rounded-full border-2 border-background shadow-md"></div>
<!-- Edge Nodes -->
<div class="absolute top-1/2 left-0 transform -translate-x-1/2 -translate-y-1/2 w-2.5 h-2.5 bg-[#3b82f6] rounded-sm border-[1.5px] border-background"></div>
<div class="absolute top-1/2 right-0 transform translate-x-1/2 -translate-y-1/2 w-2.5 h-2.5 bg-[#3b82f6] rounded-sm border-[1.5px] border-background"></div>
<!-- Contextual Menu Popup (Simulated active state on top edge) -->
<div class="absolute top-[-15px] left-1/2 transform translate-x-[40px] -translate-y-full z-30">
<div class="bg-surface-container-high border border-outline-variant rounded-xl w-40 overflow-hidden shadow-2xl">
<div class="flex items-center justify-between px-3 py-2 border-b border-outline-variant/50">
<span class="text-[9px] font-bold text-primary uppercase tracking-widest">Aresta Superior</span>
<span class="material-symbols-outlined text-[14px] text-secondary cursor-pointer hover:text-on-surface">close</span>
</div>
<div class="p-1.5 flex flex-col gap-1">
<button class="w-full bg-[#2563eb] text-white text-xs font-semibold px-3 py-1.5 rounded-lg text-left flex justify-between items-center shadow-[0_2px_10px_rgba(37,99,235,0.3)]">
<span>FRONTÃO</span>
<span class="material-symbols-outlined text-[14px]">add</span>
</button>
<button class="w-full hover:bg-surface-container-highest text-secondary text-xs font-medium px-3 py-1.5 rounded-lg text-left transition-colors">SAIA</button>
<button class="w-full hover:bg-surface-container-highest text-secondary text-xs font-medium px-3 py-1.5 rounded-lg text-left transition-colors">LATERAL</button>
<button class="w-full hover:bg-surface-container-highest text-secondary text-xs font-medium px-3 py-1.5 rounded-lg text-left transition-colors">BORDA</button>
</div>
</div>
<!-- Pointer triangle -->
<div class="absolute bottom-[-5px] left-6 w-3 h-3 bg-surface-container-high border-b border-r border-outline-variant transform rotate-45"></div>
</div>
</div>
</div>
<!-- Example 3D Rendered Object Placeholder (Bottom Right) -->
<div class="absolute bottom-16 right-20 w-64 h-16 transform rotate-[-15deg] perspective-[1000px] z-10 opacity-80 pointer-events-none">
<div class="w-full h-full relative" style="transform-style: preserve-3d; transform: rotateX(60deg) rotateZ(-20deg);">
<!-- Top surface -->
<div class="absolute inset-0 bg-surface-container border border-outline shadow-2xl" style="transform: translateZ(10px);">
<div class="w-full h-full bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0IiBoZWlnaHQ9IjQiPjxyZWN0IHdpZHRoPSI0IiBoZWlnaHQ9IjQiIGZpbGw9IiMzMzMiLz48cmVjdCB3aWR0aD0iMiIgaGVpZ2h0PSIyIiBmaWxsPSIjNDQ0Ii8+PC9zdmc+')] opacity-20 mix-blend-overlay"></div>
</div>
<!-- Front surface -->
<div class="absolute bottom-0 left-0 w-full h-[10px] bg-surface border border-outline origin-bottom" style="transform: rotateX(-90deg);"></div>
<!-- Side surface -->
<div class="absolute top-0 right-0 w-[10px] h-full bg-surface-variant border border-outline origin-right" style="transform: rotateY(90deg);"></div>
<!-- Back splash surface -->
<div class="absolute top-0 left-0 w-full h-[15px] bg-surface border border-outline origin-top" style="transform: rotateX(90deg) translateZ(10px);"></div>
</div>
</div>
</main>
</div>
</body></html>
